[project]
name = "fpga-proj-tmpl"
version = "0.1.0"
description = "A FPGA project template using SystemVerilog, cocotb, and Verilator."
requires-python = ">=3.13,<3.14"
dependencies = [
    "cocotb>=2.0.1",
    "cocotb-coverage>=2.0.0",
    "pytest>=9.0.3",
]

[dependency-groups]
dev = [
    #"basedpyright>=1.39.8",
    "pyrefly>=1.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "E501", "I", "SIM", "UP", "ANN", "PYI"]
preview = true

[tool.ruff.lint.per-file-ignores]
# cocotb's `dut` handle is dynamically typed; `Any` is the pragmatic annotation
# (concrete handle types lack the runtime signal attributes), so allow it here.
"tests/**" = ["ANN401"]

[tool.pyrefly]
preset = "strict"
search-path = [".", "tests"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
