[project]
name = "fpga-proj-tmpl"
version = "0.1.0"
description = "A minimal FPGA project template using SystemVerilog, cocotb, and Verilator."
requires-python = ">=3.13,<3.14"
dependencies = [
    "cocotb>=2.0.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
