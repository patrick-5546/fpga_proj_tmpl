[project]
name = "fpga-proj-tmpl"
version = "0.1.0"
description = "A FPGA project template using SystemVerilog, cocotb, and Verilator."
requires-python = ">=3.13,<3.14"
dependencies = [
    "cocotb>=2.0.1",
    "cocotb-coverage>=2.0.0",
    "pytest>=9.0.3",
    "pytest-timeout>=2.4.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]
pythonpath = [".", "tests"]
timeout = 30

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "E501", "I", "SIM", "UP"]

[tool.basedpyright]
typeCheckingMode = "standard"
