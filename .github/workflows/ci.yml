name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  VERILATOR_VERSION: v5.048
  VERIBLE_VERSION: v0.0-4053-g89d4d98a
  LCOV_VERSION: v2.4

jobs:
  lint-sv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v5
        with:
          path: /opt/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ccache help2man libfl-dev
          git clone https://github.com/verilator/verilator --branch "$VERILATOR_VERSION" --depth 1 /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix=/opt/verilator
          make -j"$(nproc)"
          make install

      - name: Add Verilator to PATH
        run: echo "/opt/verilator/bin" >> "$GITHUB_PATH"

      - name: Install Verible
        run: |
          curl -fsSL "https://github.com/chipsalliance/verible/releases/download/${VERIBLE_VERSION}/verible-${VERIBLE_VERSION}-linux-static-x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          sudo chmod -R a+rX /usr/local/bin

      - run: make sv-format-check sv-lint verilator-lint

  lint-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync

      - run: make py-format-check py-lint py-type

  lint-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install markdownlint-cli2
        run: sudo npm install -g markdownlint-cli2

      - run: make md-lint

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v5
        with:
          path: /opt/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ccache help2man libfl-dev
          git clone https://github.com/verilator/verilator --branch "$VERILATOR_VERSION" --depth 1 /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix=/opt/verilator
          make -j"$(nproc)"
          make install

      - name: Install ccache and LCOV
        run: |
          sudo apt-get update && sudo apt-get install -y ccache libcapture-tiny-perl libdatetime-perl
          curl -fsSL "https://github.com/linux-test-project/lcov/releases/download/${LCOV_VERSION}/lcov-${LCOV_VERSION#v}.tar.gz" \
            | sudo tar -xz -C /opt
          echo "/opt/lcov-${LCOV_VERSION#v}/bin" >> "$GITHUB_PATH"

      - name: Add Verilator to PATH
        run: echo "/opt/verilator/bin" >> "$GITHUB_PATH"

      - run: uv sync

      - name: Run coverage
        run: make coverage

      - name: Generate HTML report and enforce thresholds
        run: |
          genhtml build/verilator/coverage.info \
            --output-directory build/verilator/coverage_html \
            --branch-coverage --no-function-coverage \
            --show-details --legend \
            --title "Verilator HDL coverage" \
            --prefix "${{ github.workspace }}" \
            --fail-under-lines 90 \
            --fail-under-branches 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hdl-coverage-report
          path: build/verilator/coverage_html

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v5
        with:
          path: /opt/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ccache help2man libfl-dev
          git clone https://github.com/verilator/verilator --branch "$VERILATOR_VERSION" --depth 1 /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix=/opt/verilator
          make -j"$(nproc)"
          make install

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Add Verilator to PATH
        run: echo "/opt/verilator/bin" >> "$GITHUB_PATH"

      - run: uv sync

      - run: make test
